site_name: PyNet
site_url: https://robcox2910.github.io/pynet/
site_description: "Build your own networking library in Python: DNS, TCP, UDP, HTTP, WebSockets and SMTP over raw sockets, explained for learners."
repo_url: https://github.com/robcox2910/pynet
repo_name: robcox2910/pynet

# theme:start
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight

# Social cards need cairo, so they are off unless SOCIAL_CARDS is set (the
# shared docs workflow sets it). A repo must not add its own plugins key.
plugins:
  - search
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
# theme:end

exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - Base64: concepts/base64.md
  - Cancellation and Timeouts: concepts/cancellation-and-timeouts.md
  - DNS: concepts/dns.md
  - The Event Loop: concepts/event-loop.md
  - Framing: concepts/framing.md
  - FTP: concepts/ftp.md
  - Heartbeats and Reconnect: concepts/heartbeats-and-reconnect.md
  - HTTP Client: concepts/http-client.md
  - JSON Client: concepts/json-client.md
  - Messaging: concepts/messaging.md
  - Our Loop vs asyncio: concepts/our-loop-vs-asyncio.md
  - Ping (ICMP): concepts/ping.md
  - The Self-Pipe Trick: concepts/self-pipe-trick.md
  - SMTP: concepts/smtp.md
  - "Streams: Water Pipes with a Tap": concepts/streams.md
  - "Subprocesses: Helpers and Baby Monitors": concepts/subprocesses.md
  - "Sync Primitives -- Pistol, Conveyor Belt, Key and Car Park": concepts/sync-primitives.md
  - Tasks and Await: concepts/tasks-and-await.md
  - TCP: concepts/tcp.md
  - "Worker Threads: Sending a Slow Errand to a Helper": concepts/threads.md
  - Timers: concepts/timers.md
  - TLS Handshake: concepts/tls.md
  - UDP: concepts/udp.md
  - URLs: concepts/urls.md
  - "WebSocket, For Real": concepts/websocket-real.md
  - WebSocket: concepts/websocket.md
  - Property Testing: property-testing.md
